term xterm-kitty

# BEGIN_KITTY_THEME
# Everforest Dark Medium
include current-theme.conf

font_size 10.0

# BEGIN_KITTY_FONTS
# Using JetBrainsMono NF for consistency with rofi and Nerd Font icon support
font_family JetBrainsMono Nerd Font
# Disable ligatures at cursor position — reduces OpenType render cost
disable_ligatures cursor
# END_KITTY_FONTS

# No --login: avoids loading /etc/profile and login scripts on every tab
shell /usr/bin/fish

# Cursor — static cursor = zero idle GPU redraws
cursor_text_color #111111
cursor_shape      underline
cursor_blink_interval 0

# Scrollback — bounded: unlimited causes OOM + kitty_grab freeze
scrollback_lines 10000
scrollback_pager_history_size 50

# Mouse
copy_on_select yes
url_prefixes   http https file ssh
detect_urls    yes
strip_trailing_spaces smart

# Performance — explicit X11 + tighter repaint/input timing
sync_to_monitor yes
linux_display_server x11
input_delay 0
repaint_delay 7

# Bell
bell_on_tab "🔔 "

# Transparency — uncomment and tweak opacity to taste
# background_opacity 0.92

# Window
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}.sock
hide_window_decorations yes

# Tab bar — powerline is lighter than the default fade animation
tab_bar_style powerline

# Kittens
# ctrl+shift+f — search scrollback buffer (like Ctrl+F in a browser)
map ctrl+shift+f launch --allow-remote-control kitty +kitten kitty_search/search.py @active-kitty-window-id

# ctrl+shift+g — vim-like keyboard text selection and copy without mouse
map ctrl+shift+g kitten kitty_grab/grab.py
# END_KITTY_THEME
